[workspace]
authors = ["Olivier Roussel <olivier.roussel@inria.fr>"]
channels = ["conda-forge", "https://prefix.dev/sofa-framework"]
name = "Sofa.RigidBodyDynamics"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "25.12.99"
license = "LGPL-2.1-or-later"
license-file = "License.md"

# TODO: add ccache support
[dependencies]
cmake = ">=3.22"
ninja = ">=1.11"
pkg-config = "*"
git = ">=2.47.0"
python = ">=3.10.0"
pinocchio = ">=3.0.0"
sofa-devel = ">=25.06.00"
sofa-python3 = ">=25.06.00"
sofa-softrobots = ">=25.06.00"
sofa-softrobotsinverse = ">=25.06.00"

[target.unix.dependencies]
cxx-compiler = ">=1.7.0"

[target.win-64.dependencies]
vs2022_win-64 = ">=19.42.0"

[feature.examples.dependencies]
sofa-app = ">=25.06.00"
sofa-glfw = ">=25.06.00"
example-robot-data = "*"

[feature.examples.activation]
env = { URDF_MODEL_PATH="$CONDA_PREFIX/share" }

[tasks]
configure = { cmd = [
  "cmake",
  "-G",
  "Ninja",
  "-B",
  "build",
  "-S",
  ".",
  "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
  "-DCMAKE_BUILD_TYPE=Release"
] }
build = { cmd = "cmake --build build --target all --parallel 8", depends-on = ["configure"] }
install = { cmd = "cmake --build build --target install", depends-on = ["build"] }
clean = { cmd = "rm -rf build" }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }

[feature.examples.tasks]
example-simple-arm = { cmd = "$CONDA_PREFIX/bin/runSofa -l SofaPython3 -l Sofa.RigidBodyDynamics -l SofaImGui -g imgui $PIXI_PROJECT_ROOT/examples/sofa/RigidBodyDynamics/JointActuator/JointActuator.py", depends-on = ["install"] }
# Loads a robot from the URDF file given in argument with a GUI to control it DoFs,
# assuming the URDF model path is in previsoulsy defined URDF_MODEL_PATH environnement variable,
# i.e. given URDF filename must be given to this directory.
# Example:
# pixi run example-load-robot example-robot-data/robots/talos_data/robots/talos_reduced_corrected.urdf
example-load-robot = { cmd = "$CONDA_PREFIX/bin/runSofa -l SofaPython3 -l Sofa.RigidBodyDynamics -l SofaImGui -g imgui $PIXI_PROJECT_ROOT/examples/sofa/RigidBodyDynamics/LoadRobot/robot.py --argv", depends-on = ["install"] }
# TODO
example-inverse-hand = { cmd = "$CONDA_PREFIX/bin/runSofa -l SofaPython3 -l Sofa.RigidBodyDynamics -l SofaImGui -g imgui $PIXI_PROJECT_ROOT/examples/sofa/RigidBodyDynamics/InverseKineHand/InverseKineHand.py", depends-on = ["install"] }

[environments]
default = { solve-group = "base" }
with-examples = { features = ["examples"], solve-group = "base" }